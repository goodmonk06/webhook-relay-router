# Webhook Relay Router Configuration
# このファイルをコピーして routes.yml を作成してください

routes:
  # Stripe Webhook
  - provider: stripe
    path: /webhook/stripe
    forwardUrl: https://internal.example.com/api/stripe
    secret: whsec_your_stripe_webhook_secret_here
    enabled: true
    description: Stripe payment webhooks

  # GitHub Webhook
  - provider: github
    path: /webhook/github
    forwardUrl: https://internal.example.com/api/github
    secret: your_github_webhook_secret_here
    enabled: true
    description: GitHub repository events

  # Slack Webhook
  - provider: slack
    path: /webhook/slack
    forwardUrl: https://internal.example.com/api/slack
    secret: your_slack_signing_secret_here
    enabled: true
    description: Slack event subscriptions and slash commands

  # Shopify Webhook
  - provider: shopify
    path: /webhook/shopify
    forwardUrl: https://internal.example.com/api/shopify
    secret: your_shopify_webhook_secret_here
    enabled: true
    description: Shopify order, product, and inventory webhooks

  # Twilio Webhook
  - provider: twilio
    path: /webhook/twilio
    forwardUrl: https://internal.example.com/api/twilio
    secret: your_twilio_auth_token_here
    enabled: true
    description: Twilio SMS and call status webhooks

  # SendGrid Webhook
  - provider: sendgrid
    path: /webhook/sendgrid
    forwardUrl: https://internal.example.com/api/sendgrid
    secret: your_sendgrid_webhook_secret_here
    enabled: true
    description: SendGrid email event webhooks

  # Generic Webhook (署名検証なし)
  - provider: generic
    path: /webhook/generic
    forwardUrl: https://internal.example.com/api/generic
    enabled: true
    description: Generic webhook without signature verification

# グローバル設定
settings:
  # ログ保存設定
  logging:
    enabled: true
    storageType: file # file または database
    retentionDays: 30

  # 転送設定
  forwarding:
    timeout: 10000 # タイムアウト (ms)
    retryCount: 3 # リトライ回数
    retryDelay: 1000 # リトライ間隔 (ms)

  # セキュリティ設定
  security:
    allowedIps: [] # 空の場合は全てのIPを許可
    rateLimit:
      enabled: true
      max: 100 # 1分あたりの最大リクエスト数
      window: 60000 # ウィンドウ時間 (ms)
