version: '3.8'

services:
  webhook-router:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: webhook-relay-router
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      - ROUTES_CONFIG_PATH=/app/config/routes.yml
      - LOG_LEVEL=info
      - LOG_DIR=/app/logs
    volumes:
      - ./config/routes.yml:/app/config/routes.yml:ro
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => { process.exit(r.statusCode === 200 ? 0 : 1); })"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  # モックの内部サーバー（デモ・開発用）
  mock-server:
    image: node:20-alpine
    container_name: webhook-mock-server
    working_dir: /app
    command: node /app/demo/mock-server.js
    ports:
      - "4000:4000"
    volumes:
      - ./demo:/app/demo:ro
    environment:
      - PORT=4000
    restart: unless-stopped
